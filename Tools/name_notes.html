<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>天国スタジオの項目名ノート</title>
<style>
/* Layout: a sticky band with tabs and search; game list on the left, the game's items on the right, like a remix editor's track list */
:root {
  --bg: #eef1f7; --panel: #ffffff; --ink: #1c2233; --muted: #626b82; --line: #d5dbe8;
  --accent: #3a3fb8; --accent-ink: #ffffff; --changed: #ffe36b; --changed-ink: #4a3b00; --official: #0d7a5f; --danger: #b3261e;
  --font-display: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --font-body: "Hiragino Sans", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #14172a; --panel: #1e2238; --ink: #edf0fa; --muted: #a0a8c2; --line: #343a57;
  --accent: #9aa0ff; --accent-ink: #14172a; --changed: #6b5a10; --changed-ink: #ffeea6; --official: #62d8b6; --danger: #ff9b92; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #14172a; --panel: #1e2238; --ink: #edf0fa; --muted: #a0a8c2; --line: #343a57;
  --accent: #9aa0ff; --accent-ink: #14172a; --changed: #6b5a10; --changed-ink: #ffeea6; --official: #62d8b6; --danger: #ff9b92; color-scheme: dark }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); }
.band { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 10px; }
.band-top { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
h1 { font: 800 1.3rem/1.2 var(--font-display); margin: 0; }
#status { font-size: .82rem; color: var(--muted); }
#status.bad { color: var(--danger); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; }
.tab { font: 700 .9rem var(--font-body); padding: 6px 12px; border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
#search { flex: 1 1 200px; min-width: 0; font: inherit; padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); }
main { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; padding-block: 16px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1180px; margin: 0 auto; }
main.wide { grid-template-columns: minmax(0, 1fr); }
#games { display: grid; gap: 2px; position: sticky; top: 130px; max-height: calc(100vh - 150px); overflow-y: auto; }
#games button { all: unset; box-sizing: border-box; cursor: pointer; display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; border-radius: 8px; font-size: .9rem; }
#games button:hover { background: var(--panel); }
#games button[aria-current="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
#games button:focus-visible, .tab:focus-visible, input:focus-visible, .link:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#game-select { display: none; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); width: 100%; }
.count { background: var(--changed); color: var(--changed-ink); font-size: .75rem; font-weight: 700; padding: 0 7px; border-radius: 999px; font-variant-numeric: tabular-nums; }
#view { min-width: 0; display: grid; gap: 14px; }
h2 { font: 800 1.2rem var(--font-display); margin: 0; }
.lead { color: var(--muted); font-size: .88rem; margin: 0; max-width: 65ch; }
.event { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); gap: 4px 14px; padding: 8px 12px; align-items: center; }
.row + .row { border-top: 1px solid var(--line); }
.row.param { padding-left: 26px; }
.en { font-size: .85rem; min-width: 0; overflow-wrap: anywhere; }
.row.ev .en { font-weight: 700; font-size: .92rem; }
.tip, .was, .where { display: block; color: var(--muted); font-size: .76rem; overflow-wrap: anywhere; }
.chip { font-size: .68rem; font-weight: 700; color: var(--official); border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-left: 6px; white-space: nowrap; }
.field { min-width: 0; display: grid; gap: 2px; }
.field input { width: 100%; box-sizing: border-box; font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--ink); }
.field.on input { background: var(--changed); color: var(--changed-ink); border-color: transparent; font-weight: 700; }
.link { all: unset; cursor: pointer; color: var(--accent); font-size: .78rem; text-decoration: underline; justify-self: start; }
.btn { font: 700 .88rem var(--font-body); padding: 7px 14px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
#banner { background: var(--changed); color: var(--changed-ink); padding: 8px 12px; border-radius: 8px; font-size: .86rem; }
.empty { color: var(--muted); padding: 24px 0; }
#export { width: 100%; box-sizing: border-box; min-height: 120px; font: .78rem ui-monospace, monospace; background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
@media (max-width: 760px) {
  main { grid-template-columns: minmax(0, 1fr); }
  #games { display: none; } #game-select { display: block; }
  .row { grid-template-columns: minmax(0, 1fr); } .row.param { padding-left: 12px; }
  .band { position: static; }
}
@media (prefers-reduced-motion: no-preference) { .tab, #games button { transition: background .12s; } }
</style></head><body>
<header class="band">
  <div class="band-top">
    <h1>天国スタジオの項目名ノート</h1>
    <span id="status" role="status">読み込み中…</span>
  </div>
  <div class="controls">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-games" data-tab="games">ゲーム別</button>
      <button class="tab" role="tab" id="tab-common" data-tab="common">共通の言葉</button>
      <button class="tab" role="tab" id="tab-enums" data-tab="enums">選択肢</button>
      <button class="tab" role="tab" id="tab-changes" data-tab="changes">変更一覧 <span id="total">0</span></button>
    </div>
    <input id="search" type="search" placeholder="英語や日本語で探す（例：Bop、ウラ）" aria-label="項目を探す">
  </div>
</header>
<main id="main">
  <nav id="games" aria-label="ゲーム"></nav>
  <div id="view"></div>
</main>

<script type="application/json" id="data">/*DATA*/</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };

function hash(s) { // stable document id for a key
  let a = 0xdeadbeef, b = 0x41c6ce57;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); }
  a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909);
  b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909);
  return (b >>> 0).toString(36) + (a >>> 0).toString(36);
}
const item = (kind, key, en, ja, extra) => Object.assign({ id: kind + '_' + hash(key), kind, key, en, ja }, extra);

// every editable name
const all = [];
for (const g of DATA.games) {
  g.items = [];
  for (const e of g.events) {
    const ev = item('event', g.id + '/' + e.a, e.en, e.ja, { game: g, official: e.off, tip: e.tip, common: 'event:' + e.en });
    ev.params = e.params.map((p) => item('param', g.id + '/' + e.a + '/' + p.p, p.en, p.ja, { game: g, event: e.en, tip: p.tip, common: 'param:' + p.en }));
    g.items.push(ev); all.push(ev, ...ev.params);
  }
}
const groups = {};
for (const it of all) (groups[it.common] ||= []).push(it);
const commons = Object.entries(groups).filter(([, v]) => v.length > 1).map(([k, v]) => {
  const tally = {}; for (const i of v) tally[i.ja] = (tally[i.ja] || 0) + 1;
  const ja = Object.entries(tally).sort((a, b) => b[1] - a[1])[0][0];
  return item('common', k, v[0].en, ja, { n: v.length, type: k.split(':')[0] });
}).sort((a, b) => b.n - a.n);
const enums = DATA.enums.map((e) => item('enum', e.k, e.k, e.ja, {}));
const byId = new Map([...all, ...commons, ...enums].map((i) => [i.id, i]));
const commonOf = new Map(commons.map((c) => [c.key, c]));

// edits: id -> saved entry, kept by Tools/name_notes.py in Tools/name_notes_edits.json
const edits = new Map(Object.entries(DATA.edits));
let tab = 'games', game = DATA.games[0];
function status(text, bad) { const s = $('status'); s.textContent = text; s.classList.toggle('bad', !!bad); }
const post = (path, body) => fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

async function save(it, raw) {
  const value = raw.trim();
  const same = !value || value === it.ja;
  if (same) edits.delete(it.id);
  else edits.set(it.id, { kind: it.kind, key: it.key, en: it.en, before: it.ja, value, savedAt: new Date().toISOString() });
  counts();
  try {
    const res = await post('/api/edit', { id: it.id, entry: same ? null : edits.get(it.id) });
    if (!res.ok) throw new Error();
    status('保存しました');
  } catch { status('保存できませんでした。ターミナルの name_notes.py が動いているか確かめてください', true); }
}

function shown(it) { // own edit, then the shared-word edit, then the current name
  const own = edits.get(it.id);
  if (own) return { value: own.value, on: true };
  const c = it.common && commonOf.get(it.common);
  const ce = c && edits.get(c.id);
  if (ce) return { value: ce.value, on: true, viaCommon: true };
  return { value: it.ja, on: false };
}

function row(it, cls, sub) {
  const r = el('div', 'row ' + cls), left = el('div', 'en'), f = el('div', 'field');
  left.append(it.en);
  if (it.official) left.append(el('span', 'chip', '公式'));
  if (it.n) left.append(el('span', 'chip', it.n + 'か所'));
  if (sub) left.append(el('span', 'where', sub));
  if (it.tip) left.append(el('span', 'tip', it.tip));
  const s = shown(it), input = el('input');
  input.id = 'in-' + it.id; input.value = s.value; input.setAttribute('aria-label', it.en + ' の名前'); input.autocomplete = 'off';
  f.append(input); f.classList.toggle('on', s.on);
  const paint = () => {
    f.querySelectorAll('.was, .link').forEach((n) => n.remove());
    const now = shown(it); f.classList.toggle('on', now.on);
    if (!now.on) return;
    f.append(el('span', 'was', (now.viaCommon ? '共通の言葉から ／ ' : '') + '今の名前：' + it.ja));
    if (edits.has(it.id)) {
      const b = el('button', 'link', '元に戻す'); b.type = 'button';
      b.onclick = async () => { await save(it, it.ja); input.value = shown(it).value; paint(); };
      f.append(b);
    }
  };
  input.addEventListener('change', async () => { await save(it, input.value); paint(); });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') input.blur(); });
  paint();
  r.append(left, f);
  return r;
}

function counts() {
  $('total').textContent = edits.size;
  const per = new Map();
  for (const id of edits.keys()) { const g = byId.get(id)?.game; if (g) per.set(g.id, (per.get(g.id) || 0) + 1); }
  for (const b of $('games').children) {
    const n = per.get(b.dataset.id) || 0, c = b.querySelector('.count');
    c.hidden = !n; c.textContent = n;
  }
}

function list(title, lead, rows) {
  const v = $('view'); v.replaceChildren();
  if (title) v.append(el('h2', '', title));
  if (lead) v.append(el('p', 'lead', lead));
  const box = el('div', 'event'); rows.forEach((r) => box.append(r));
  if (rows.length) v.append(box); else v.append(el('p', 'empty', 'ここに出す項目はありません。'));
}

function render() {
  for (const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', t.dataset.tab === tab);
  const q = $('search').value.trim().toLowerCase();
  $('main').classList.toggle('wide', tab !== 'games' || !!q);
  $('games').hidden = tab !== 'games' || !!q;
  if (q) {
    const hit = (i) => (i.en + ' ' + i.ja + ' ' + shown(i).value).toLowerCase().includes(q);
    const pool = tab === 'enums' ? enums : tab === 'common' ? commons : all;
    const found = pool.filter(hit);
    return list('「' + $('search').value.trim() + '」の検索結果（' + found.length + '件）', found.length > 200 ? '最初の200件を出しています。言葉を足して絞ってください。' : '',
      found.slice(0, 200).map((i) => row(i, '', i.game ? i.game.name + (i.event ? ' ／ ' + i.event : '') : '')));
  }
  if (tab === 'games') {
    const v = $('view'); v.replaceChildren(); v.append(selectBox());
    v.append(el('h2', '', game.name));
    v.append(el('p', 'lead', '右の欄を書き換えて欄の外を押すと保存されます。空にするか今の名前に戻すと、変更は取り消しになります。'));
      for (const ev of game.items) {
      const box = el('div', 'event'); box.append(row(ev, 'ev'));
      ev.params.forEach((p) => box.append(row(p, 'param')));
      v.append(box);
    }
    if (!game.items.length) v.append(el('p', 'empty', 'このゲームに項目はありません。'));
  } else if (tab === 'common') {
    list('共通の言葉', '複数の場所で使っている名前です。ここで変えると、同じ英語名の項目すべてに反映します。ゲーム別で個別に決めた名前はそちらを優先します。', commons.map((c) => row(c, '', c.type === 'event' ? 'イベント名' : 'プロパティ名')));
  } else if (tab === 'enums') {
    list('選択肢', 'プルダウンに出る選択肢の名前です。', enums.map((e) => row(e, '')));
  } else {
    const items = [...edits.keys()].map((id) => byId.get(id)).filter(Boolean);
    list('変更一覧', items.length ? '「アプリに反映」を押すと翻訳ファイルに書き込みます。アプリに出すには、そのあとビルドが必要です。' : 'まだ変更はありません。ゲーム別の欄を書き換えると、ここに並びます。',
      items.map((i) => row(i, '', i.game ? i.game.name + (i.event ? ' ／ ' + i.event : '') : (i.kind === 'common' ? '共通の言葉' : '選択肢'))));
    if (items.length) {
      const b = el('button', 'btn', 'アプリに反映'); b.type = 'button';
      b.onclick = async () => {
        b.disabled = true; status('反映しています…');
        try {
          const res = await post('/api/apply', {});
          if (!res.ok) throw new Error();
          location.reload();
        } catch { b.disabled = false; status('反映できませんでした。ターミナルの表示を確かめてください', true); }
      };
      $('view').append(b);
    }
  }
}

function selectBox() {
  const s = el('select'); s.id = 'game-select'; s.setAttribute('aria-label', 'ゲーム');
  for (const g of DATA.games) { const o = el('option', '', g.name); o.value = g.id; o.selected = g === game; s.append(o); }
  s.onchange = () => { game = DATA.games.find((g) => g.id === s.value); render(); };
  return s;
}

for (const g of DATA.games) {
  const b = el('button'); b.type = 'button'; b.dataset.id = g.id;
  const c = el('span', 'count'); c.hidden = true;
  b.append(el('span', '', g.name), c);
  b.onclick = () => { game = g; for (const x of $('games').children) x.setAttribute('aria-current', x === b); render(); scrollTo(0, 0); };
  b.setAttribute('aria-current', g === game);
  $('games').append(b);
}
for (const t of document.querySelectorAll('.tab')) t.onclick = () => { tab = t.dataset.tab; render(); scrollTo(0, 0); };
let timer; $('search').addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(render, 150); });

counts(); render(); status(edits.size ? '保存済みの変更 ' + edits.size + '件' : '保存できます');
</script>
</body></html>
